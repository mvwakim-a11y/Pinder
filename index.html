<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinder</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #589384;
      color: #1c3932;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: manipulation;
    }
    #board-input { padding: 20px; text-align: center; width: 100%; max-width: 400px; }
    #board-url {
      width: 80%; max-width: 320px; padding: 12px; border-radius: 12px;
      border: 1px solid #091613; background: #1c3932; color: #5a798c; font-size: 16px;
    }
    #load-board {
      margin-top: 12px; padding: 12px 24px; background: #9673be; border: none;
      border-radius: 12px; color: #6872b6; font-size: 16px; cursor: pointer;
    }
    #stack {
      position: relative; width: 320px; height: 480px; margin: 20px 0; perspective: 1000px;
    }
    .card {
      position: absolute; inset: 0; border-radius: 16px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.45s ease, box-shadow 0.35s ease;
      user-select: none; cursor: grab;
      will-change: transform, opacity, box-shadow;
      transform: translateZ(0); backface-visibility: hidden;
      opacity: 0; transform: translateZ(0) scale(0.92);
    }
    .card.visible { opacity: 1; transform: translateZ(0) scale(1); }
    .card.dragging {
      transform: translateZ(0) scale(1.05); transition: none;
      box-shadow: 0 25px 60px rgba(0,0,0,0.75);
    }
    .card.reacted {
      transform: translateZ(0) scale(1.04);
      box-shadow: 0 18px 50px rgba(0,0,0,0.7);
    }
    .card:not(:first-child) { pointer-events: none; }
    .card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .card.like { transform: translateX(220%) rotate(28deg) translateZ(0) !important; opacity: 0; }
    .card.dislike { transform: translateX(-220%) rotate(-28deg) translateZ(0) !important; opacity: 0; }

    .reaction-bar {
      position: absolute; bottom: 12px; left: 12px; right: 12px;
      display: flex; justify-content: center; pointer-events: none;
    }
    .reaction-bar .reactions {
      display: flex; gap: 8px; background: rgba(0,0,0,0.45); padding: 8px 14px;
      border-radius: 999px; pointer-events: auto;
    }
    .reaction-bar .react {
      background: rgba(255,255,255,0.18); border: none; color: white;
      padding: 7px 13px; border-radius: 999px; font-size: 15px; cursor: pointer;
      transition: all 0.18s ease; touch-action: manipulation;
    }
    .reaction-bar .react:hover, .reaction-bar .react:active {
      background: rgba(255,255,255,0.35); transform: scale(1.14);
    }
    .reaction-bar .react.active {
      background: rgba(255, 220, 100, 0.7); transform: scale(1.12);
    }
    .reaction-bar .add-custom { padding: 7px 13px; font-size: 15px; }

    #comment-section {
      width: 320px; background: #1a1a1a; padding: 16px; border-radius: 12px;
      margin: 16px 0; max-height: 35vh; overflow-y: auto; border: 1px solid #333;
    }
    #reactions-summary {
      margin-bottom: 16px; text-align: center; color: #fff; font-size: 22px;
      display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
    }
    #comments-list { margin-bottom: 16px; }
    #comments-list p {
      margin: 8px 0; padding: 8px 12px; background: #2a2a2a; border-radius: 8px;
    }
    #comment-form { display: flex; gap: 8px; }
    #comment-input {
      flex: 1; padding: 12px; border-radius: 12px; border: none;
      background: #333; color: white; font-size: 15px;
    }
    #comment-form button {
      padding: 12px 20px; background: #007bff; border: none;
      border-radius: 12px; color: white; cursor: pointer; font-size: 15px;
    }
    #undo-btn {
      position: fixed; top: 16px; right: 16px; padding: 10px 20px;
      background: #ffc107; color: black; border: none; border-radius: 12px;
      cursor: pointer; z-index: 100; font-size: 15px;
    }
    h3 { margin-top: 0; font-size: 18px; }
    p.loading { text-align: center; padding: 40px; font-size: 18px; color: white; }
    @media (max-width: 500px) {
      #stack { width: 90vw; height: 60vh; }
      #comment-section, #board-url { width: 90vw; }
    }
  </style>
</head>
<body>

  <div id="board-input">
    <input id="board-url" type="text" placeholder="Paste Pinterest board URL" />
    <button id="load-board">Load Board</button>
  </div>

  <div id="stack"></div>

  <div id="comment-section">
    <h3>Reactions & Comments</h3>
    <div id="reactions-summary"></div>
    <div id="comments-list"></div>
    <form id="comment-form">
      <input id="comment-input" type="text" placeholder="Add comment or #tag..." />
      <button type="submit">Post</button>
    </form>
  </div>

  <button id="undo-btn">Undo</button>

  <script>
    let photos = [];
    let currentIndex = 0;
    const API_KEY = 'LEKTZUi74XWUUPeZN7axp1fCkwT2';
    const fixedReactions = ['👍', '❤️', '😮'];

    const stack = document.getElementById('stack');
    const boardUrlInput = document.getElementById('board-url');
    const loadBoardBtn = document.getElementById('load-board');

    function throttle(fn, delay) {
      let last = 0;
      return (...args) => {
        const now = Date.now();
        if (now - last >= delay) {
          last = now;
          fn(...args);
        }
      };
    }

    function createCard(photo, idx) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = idx;

      let html = fixedReactions.map(em => {
        const v = photo.reactions[em] || 0;
        return `<button class="react ${v===1?'active':''}" data-p="${em}">${em}</button>`;
      }).join('');

      Object.entries(photo.reactions).forEach(([em,v]) => {
        if (v===1 && !fixedReactions.includes(em)) {
          html += `<button class="react active" data-p="${em}">${em}</button>`;
        }
      });

      card.innerHTML = `
        <img src="${photo.url}" alt="${photo.title||'Pin'}">
        <div class="reaction-bar">
          <div class="reactions">
            ${html}
            <button class="react add-custom" title="Add emoji">➕</button>
          </div>
        </div>
      `;

      // Set initial reacted state
      if (Object.values(photo.reactions).some(v => v===1)) {
        card.classList.add('reacted');
      }

      return card;
    }

    async function loadPinsFromBoard(url) {
      try {
        const res = await fetch(`https://api.scrapecreators.com/v1/pinterest/board?url=${encodeURIComponent(url)}`, {
          headers: { 'x-api-key': API_KEY }
        });
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        return (data.pins || []).map(p => ({
          id: p.id || Date.now()+Math.random(),
          url: p.images?.orig?.url || p.images?.['736x']?.url || '',
          title: p.grid_title || p.description || 'Pin',
          source: p.link || '',
          tag: null,
          comments: [],
          reactions: fixedReactions.reduce((o,e)=>{o[e]=0;return o}, {})
        })).filter(p => p.url.startsWith('https://i.pinimg.com/'));
      } catch (e) {
        console.error('Load failed:', e);
        alert('Could not load board – check console (F12)');
        return [];
      }
    }

    function save() {
      localStorage.setItem('pinterestSwipePhotos', JSON.stringify(photos));
      localStorage.setItem('pinterestSwipeIndex', currentIndex);
    }

    function loadSaved() {
      const data = localStorage.getItem('pinterestSwipePhotos');
      if (data) {
        photos = JSON.parse(data);
        currentIndex = Number(localStorage.getItem('pinterestSwipeIndex')) || 0;
        if (currentIndex >= photos.length) currentIndex = 0;
        render();
      }
    }

    function renderComments(photo) {
      document.getElementById('comments-list').innerHTML = photo.comments?.length
        ? photo.comments.map(c => `<p>${c}</p>`).join('')
        : '<p style="color:#888;text-align:center;">No comments yet</p>';
    }

    function renderSummary(photo) {
      const div = document.getElementById('reactions-summary');
      const active = Object.entries(photo.reactions||{}).filter(([,v])=>v===1).map(([k])=>k);
      div.innerHTML = active.length ? active.map(e=>`<span>${e}</span>`).join('') : '<span style="color:#888;">No reactions yet</span>';
    }

    function updateReacted() {
      const card = stack.querySelector('.card');
      if (!card) return;
      const photo = photos[currentIndex];
      const hasAny = photo && Object.values(photo.reactions||{}).some(v=>v===1);
      console.log('Updating reacted state:', hasAny ? 'ON' : 'OFF');
      card.classList.toggle('reacted', hasAny);
    }

    function render() {
      stack.innerHTML = '';
      if (currentIndex >= photos.length) {
        stack.innerHTML = '<p class="loading">All done!<br>Load new board or undo.</p>';
        document.getElementById('comments-list').innerHTML = '';
        document.getElementById('reactions-summary').innerHTML = '';
        return;
      }

      for (let i = currentIndex; i < Math.min(currentIndex + 3, photos.length); i++) {
        const c = createCard(photos[i], i);
        const off = i - currentIndex;
        c.style.transform = `translate(${off*12}px, ${off*14}px) rotate(${off*5}deg) translateZ(0) scale(0.94)`;
        c.style.zIndex = photos.length - i;
        stack.appendChild(c);
      }

      requestAnimationFrame(() => {
        document.querySelectorAll('.card').forEach(c => c.classList.add('visible'));
      });

      addSwipeListeners();
      if (photos[currentIndex]) {
        renderComments(photos[currentIndex]);
        renderSummary(photos[currentIndex]);
        updateReacted();
      }
    }

    function addSwipeListeners() {
      const card = stack.querySelector('.card');
      if (!card) return;

      let sx=0, cx=0, st=0, dragging=false;

      const start = e => {
        dragging = true;
        sx = e.touches?.[0]?.clientX ?? e.clientX;
        st = Date.now();
        card.style.transition = 'none';
        card.classList.add('dragging');
        document.addEventListener('mousemove', moveT);
        document.addEventListener('mouseup', end);
        document.addEventListener('touchmove', moveT, {passive:false});
        document.addEventListener('touchend', end);
      };

      const move = e => {
        if (!dragging) return;
        e.preventDefault();
        cx = (e.touches?.[0]?.clientX ?? e.clientX) - sx;
        card.style.transform = `translateX(${cx}px) rotate(${cx/12}deg) translateZ(0)`;
      };

      const moveT = throttle(move, 16);

      const end = () => {
        if (!dragging) return;
        dragging = false;
        card.classList.remove('dragging');
        card.style.transition = 'transform 0.45s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.45s ease';

        const vel = Math.abs(cx) / (Date.now() - st || 1);
        const thresh = window.innerWidth < 500 ? 90 : 130;

        if (Math.abs(cx) > thresh || vel > 1.3) {
          const dir = cx > 0 ? 'like' : 'dislike';
          card.classList.add(dir);
          photos[currentIndex].tag = dir;
          currentIndex++;
          setTimeout(render, 460);
          save();
        } else {
          card.style.transform = `translateX(0) rotate(0deg) translateZ(0) scale(1)`;
          setTimeout(updateReacted, 60);
        }

        sx = cx = 0;
        document.removeEventListener('mousemove', moveT);
        document.removeEventListener('mouseup', end);
        document.removeEventListener('touchmove', moveT);
        document.removeEventListener('touchend', end);
      };

      card.addEventListener('mousedown', start);
      card.addEventListener('touchstart', start, {passive:false});
    }

    stack.addEventListener('click', e => {
      const btn = e.target.closest('.react');
      if (!btn) return;
      const card = btn.closest('.card');
      const idx = Number(card?.dataset.index);
      if (idx !== currentIndex) return;

      const photo = photos[idx];

      if (btn.classList.contains('add-custom')) {
        const em = prompt('Enter emoji:')?.trim();
        if (!em) return;
        const was = photo.reactions[em] === 1;
        photo.reactions[em] = was ? 0 : 1;
        render(); // refresh for new emoji button
      } else {
        const type = btn.dataset.p;
        const was = photo.reactions[type] === 1;
        photo.reactions[type] = was ? 0 : 1;
        btn.classList.toggle('active', !was);
        if (was && !fixedReactions.includes(type)) btn.remove();
      }

      renderSummary(photo);
      updateReacted();
      save();
    });

    document.getElementById('comment-form').addEventListener('submit', e => {
      e.preventDefault();
      const inp = document.getElementById('comment-input');
      const txt = inp.value.trim();
      if (txt && photos[currentIndex]) {
        photos[currentIndex].comments.push(txt);
        renderComments(photos[currentIndex]);
        save();
        inp.value = '';
      }
    });

    document.getElementById('undo-btn').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        photos[currentIndex].tag = null;
        render();
        save();
      }
    });

    loadBoardBtn.addEventListener('click', async () => {
      const url = boardUrlInput.value.trim();
      if (!url.includes('pinterest.com')) return alert('Invalid Pinterest URL');
      stack.innerHTML = '<p class="loading">Loading...</p>';
      const pins = await loadPinsFromBoard(url);
      if (!pins.length) return stack.innerHTML = '<p class="loading">No images found.</p>';
      photos = pins;
      currentIndex = 0;
      render();
      save();
    });

    loadSaved();
    console.log('Pinder loaded – open F12 Console to see logs');
  </script>
</body>
</html>
